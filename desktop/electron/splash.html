<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading Fillop CBT Guru...</title>
<style>
  :root {
    --bg: #14181f;
    --panel: #1a1f28;
    --border: #2a3040;
    --accent: #2f6fb0;
    --text-main: #e8ebf0;
    --text-muted: #6b7488;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    background-color: var(--bg);
    font-family: -apple-system, "Segoe UI", Tahoma, sans-serif;
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .splash-container {
    width: 100%;
    max-width: 420px;
    padding: 0 40px;
    text-align: center;
  }

  .logo {
    width: 88px;
    height: 88px;
    object-fit: contain;
    margin: 0 auto 20px;
    display: block;
  }

  .app-title {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-main);
    letter-spacing: 0.2px;
    margin-bottom: 4px;
  }

  .app-subtitle {
    font-size: 11.5px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
    margin-bottom: 36px;
  }

  .progress-track {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 14px;
  }

  .progress-fill {
    height: 100%;
    width: 35%;
    background: var(--accent);
    border-radius: 2px;
    animation: indeterminate 1.3s ease-in-out infinite;
  }

  .status-text {
    font-size: 12.5px;
    color: var(--text-muted);
    min-height: 16px;
  }

  .footer-text {
    position: fixed;
    bottom: 18px;
    left: 0;
    right: 0;
    font-size: 10.5px;
    color: #3a4152;
    letter-spacing: 0.3px;
  }

  @keyframes indeterminate {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
</style>
</head>
<body>

<div class="splash-container">
  <img class="logo" src="image.png" alt="Fillop">
  <div class="app-title">Fillop CBT Guru</div>
  <div class="app-subtitle">COMPUTER BASED TEST SIMULATOR</div>

  <div class="progress-track">
    <div class="progress-fill"></div>
  </div>
  <p class="status-text" id="status">Starting application services...</p>
</div>

<div class="footer-text">FillopTech &bull; v1.0</div>

<script>
  try {
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash-status', (event, text) => {
      document.getElementById('status').innerText = text;
    });
  } catch (e) {
    console.warn("Electron environment not detected in splash screen.");
  }
</script>
</body>
</html>
