      <stop offset="0%" stop-color="#006633"/>
      <stop offset="100%" stop-color="#009944"/>
    </linearGradient>
    <linearGradient id="goldGradNeco" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E6B800"/>
