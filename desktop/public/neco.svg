  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="92" fill="url(#necoBg)" stroke="url(#goldGradNeco)" stroke-width="6"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#ffffff" stroke-width="3"/>

