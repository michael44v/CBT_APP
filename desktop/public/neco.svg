  <!-- Text NECO -->
  <text x="100" y="152" font-family="'Arial Black', sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="2">NECO</text>
  <text x="100" y="170" font-family="Arial, sans-serif" font-weight="700" font-size="8" fill="#FFD700" text-anchor="middle">NATIONAL EXAMINATIONS COUNCIL</text>
