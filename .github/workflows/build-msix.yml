name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for ia32
        run: npx electron-rebuild -f -w better-sqlite3 --arch ia32

      - name: Verify better-sqlite3 is 32-bit
        shell: pwsh
        run: |
          $file = Get-ChildItem -Path node_modules/better-sqlite3 -Recurse -Filter better_sqlite3.node | Select-Object -First 1
          if (-not $file) { throw "better_sqlite3.node not found" }
          $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          Write-Host "Machine type: 0x$($machine.ToString('X'))"
          if ($machine -ne 0x14C) { throw "better_sqlite3.node is not ia32 (expected 0x14C)" }

      - name: Build React app
        run: npm run build:react

      - name: Build NSIS installer (exe)
        run: npx electron-builder --win nsis --ia32 --publish never

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem release

      - name: Verify SQLite file is inside the packaged app
        shell: pwsh
        run: |
          $f = "release/win-ia32-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (-not (Test-Path $f)) { throw "better_sqlite3.node missing from packaged app: $f" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
          $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 4)
          if ($machine -ne 0x14C) { throw "Packaged better_sqlite3.node is not ia32" }
          Write-Host "OK: packaged SQLite module is 32-bit"

      - name: Smoke test - open a database with the packaged app
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          $exe = (Resolve-Path "release/win-ia32-unpacked/Fillop CBT Guru.exe").Path
          $code = "const path=require('path');const D=require(path.join(path.dirname(process.execPath),'resources','app.asar','node_modules','better-sqlite3'));const db=new D(':memory:');console.log('SQLite works, version', db.prepare('select sqlite_version() v').get().v)"
          $p = Start-Process -FilePath $exe -ArgumentList @("-e", "`"$code`"") -Wait -PassThru -NoNewWindow -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Get-Content out.txt
          Get-Content err.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path out.txt -Pattern "SQLite works" -Quiet)) {
            throw "SQLite failed to load from the packaged app"
          }

      - name: Install the built exe silently
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/*.exe | Select-Object -First 1
          Write-Host "Installing $($installer.Name)"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 5
          Get-Process -Name "Fillop CBT Guru" -ErrorAction SilentlyContinue | Stop-Process -Force
          $app = Join-Path $env:LOCALAPPDATA "Programs\Fillop CBT Guru\Fillop CBT Guru.exe"
          if (-not (Test-Path $app)) { throw "Installed app not found at $app" }
          Write-Host "Installed OK: $app"

      - name: Launch installed app and take screenshot
        shell: pwsh
        run: |
          $app = Join-Path $env:LOCALAPPDATA "Programs\Fillop CBT Guru\Fillop CBT Guru.exe"
          $p = Start-Process -FilePath $app -PassThru -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          Start-Sleep -Seconds 25

          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png")

          Write-Host "--- app stdout ---"; Get-Content app-out.txt -ErrorAction SilentlyContinue
          Write-Host "--- app stderr ---"; Get-Content app-err.txt -ErrorAction SilentlyContinue

          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Write-Host "App still running after 25s"
          Stop-Process -Id $p.Id -Force

      - name: Upload installer + update metadata
        uses: actions/upload-artifact@v4
        with:
          name: fillop-cbt-guru-exe
          path: |
            desktop/release/*.exe
            desktop/release/*.exe.blockmap
            desktop/release/latest.yml
          if-no-files-found: error

      - name: Deploy to server via FTPS
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          $cred = "$($env:FTP_USER):$($env:FTP_PASS)"
          $files = @()
          $files += Get-ChildItem release/*.exe
          $files += Get-ChildItem release/*.exe.blockmap
          $files += Get-Item release/latest.yml   # last on purpose

          foreach ($f in $files) {
            Write-Host "Uploading $($f.Name)..."
            curl.exe --ssl-reqd --insecure --fail --retry 3 `
              -T $f.FullName --user $cred "ftp://$($env:FTP_HOST)/"
            if ($LASTEXITCODE -ne 0) { throw "Upload failed for $($f.Name)" }
          }

      - name: Verify latest.yml on server
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: curl.exe -s https://cbt.filloptech.com/downloads/latest.yml

      - name: Upload screenshot and app logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-launch-screenshot
          path: |
            desktop/screenshot.png
            desktop/app-out.txt
            desktop/app-err.txt
          if-no-files-found: warn