name: Build MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild better-sqlite3 for ia32
        run: npm run rebuild:ia32

      - name: Build React app
        run: npm run build:react

      - name: Build appx
        run: npx electron-builder --win appx --ia32 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: fillop-cbt-guru-appx
          path: release/*.appx
          if-no-files-found: error