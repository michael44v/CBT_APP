name: Build Microsoft Store package (appx)

# Put this file at: .github/workflows/build-store-package.yml
on:
  push:
    tags:
      - "v*"          # e.g. git tag v1.0.6 && git push --tags
  workflow_dispatch:   # lets you run it manually from the Actions tab

permissions:
  contents: write      # needed to attach files to a GitHub Release

jobs:
  build-appx:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    strategy:
      fail-fast: false
      matrix:
        arch: [ia32]   # your config only targets ia32; add x64 later (and change the "80386" check)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # npmRebuild is false in your config, so rebuild better-sqlite3 for the
      # target arch explicitly (the runner is x64, the app is ia32)
      - name: Rebuild native modules
        run: npx electron-builder install-app-deps --arch=${{ matrix.arch }}

      - name: Build React app
        run: npm run build:react

      - name: Package appx
        run: npx electron-builder --win appx --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # no signing cert; the Store signs the package

      # Fails the build if better_sqlite3.node is not 32-bit (would crash on launch)
      - name: Verify native module architecture
        shell: bash
        run: |
          ls -lh release/*.appx
          f=$(find release/win-${{ matrix.arch }}-unpacked -name better_sqlite3.node | head -n1)
          echo "Found: $f"
          file "$f"
          file "$f" | grep -q "80386"

      - name: Upload appx artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbt-appx-${{ matrix.arch }}
          path: desktop/release/*.appx
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-appx
    runs-on: ubuntu-latest
    steps:
      - name: Download all appx files
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.appx
          generate_release_notes: true